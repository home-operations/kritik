# Docs-site Python toolchain for kritika.
#
# kritika is a Go module; this pyproject exists only to pin the MkDocs +
# Material toolchain that builds the docs under docs/. Go tooling ignores
# it. It is not an installable package (tool.uv.package = false): `uv run
# mkdocs …` resolves the pinned tools below from the committed uv.lock.
#
# `mise run docs` / `mise run docs-serve` drive this via uv so the versions
# are reproducible in CI (mise installs uv; uv installs from uv.lock). Bump
# a tool here, then `uv lock` and commit the refreshed uv.lock.
[project]
name = "kritika-docs"
version = "0.0.0"
description = "MkDocs Material toolchain for the kritika documentation site."
requires-python = ">=3.11"
dependencies = [
    # Material brings mkdocs and a bundled mermaid.js.
    "mkdocs-material>=9.5,<10",
    # snippets (file includes), superfences (mermaid), blocks admonitions.
    "pymdown-extensions>=10.7",
]

[tool.uv]
# This project is tooling, not a library: don't build or install it.
package = false
