---
# Default values for kritika.
#
# Most string, list and map values below are rendered through Helm's `tpl`, so
# they may carry template expressions that resolve at install time, e.g.
#   ingress.hosts[0].host: kritika.{{ .Values.global.domain }}
# Plain numbers and booleans, and `configFile`, are passed through as they are.

image:
  # -- Image repository.
  repository: ghcr.io/home-operations/kritika
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag; defaults to the chart appVersion.
  tag: ""
  # -- Pin the image by digest (sha256:…); when set, overrides the tag. The release pipeline fills it with the published image's digest.
  digest: ""

# -- Image pull secrets for private registries, for the kritika serve pods and, through the runner ServiceAccount, runner Jobs and the tool images they mount.
imagePullSecrets: []
# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""

# kritika runs as one Deployment of `kritika serve`: webhooks, the dashboard,
# the job queues, runner Jobs, the gateway and, on the replica holding the
# leader lock, the leader duties. Runner pods are not part of it: serve
# creates them as Jobs, one per review and index run.
# -- Replicas of kritika serve. Every replica serves webhooks and the dashboard and works jobs; exactly one holds the leader lock at a time. Two keep one serving while a rollout replaces the other.
replicas: 2

# -- Deployment update strategy. A rolling update that surges one pod and takes none down keeps one replica serving while the other is replaced. Helm merges maps, so a switch to `Recreate` also sets `rollingUpdate: null`.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# How kritika runs, as camelCased keys the chart turns into the KRITIKA_*
# variables of the same name (docs/configuration.md): the public URL,
# logging, the workers, polling, retention and the runner Jobs' deadline
# and RuntimeClass. Each key has one variable and nothing else sets it: the
# chart refuses a key it does not know and an `env` entry for a variable
# that has a key here. A key left out, as the commented ones are, has
# kritika's own default, which the comment shows. What is reviewed and how
# is the configuration file, `configFile` below, not a key here. Every
# value is rendered through `tpl`.
config:
  # -- (required) Public URL the dashboard is reached at (KRITIKA_WEB_URL), e.g. https://kritika.example.com; the webhooks share it under `/hooks/<app name>`. Must be an absolute http(s) URL with no query or fragment. GitHub delivers webhooks to it and sign-in redirects back to it, so the chart's Ingress or HTTPRoute must route this name.
  webUrl: ""
  # -- Log level (KRITIKA_LOG_LEVEL): debug, info, warn or error.
  logLevel: info
  # -- Log format (KRITIKA_LOG_FORMAT): json or text.
  logFormat: json
  # How often a replica retries the leader lock, and the holder checks it
  # still has it (KRITIKA_LEADER_RETRY_INTERVAL).
  # leaderRetryInterval: 15s
  # Review and index jobs one replica runs at once, each holding a runner
  # pod open (KRITIKA_REVIEW_WORKERS, KRITIKA_INDEX_WORKERS).
  # reviewWorkers: 2
  # indexWorkers: 1
  # How long a run's gateway token outlives its Job's deadline
  # (KRITIKA_GATEWAY_TOKEN_TTL).
  # gatewayTokenTtl: 1h
  # How often the leader lists each app's open pull requests, its backstop
  # for missed webhooks, 0s turning it off, and how far back a first or
  # long-idle poll looks (KRITIKA_POLL_INTERVAL, KRITIKA_POLL_LOOKBACK).
  # pollInterval: 10m
  # pollLookback: 24h
  # Onboarding index jobs the leader keeps queued or running at once
  # (KRITIKA_ONBOARD_WINDOW).
  # onboardWindow: 4
  # How long the index of a repository that stopped running is kept
  # (KRITIKA_INDEX_GRACE).
  # indexGrace: 720h
  # How long a review's model transcript, and the diff and context it was
  # made from, are kept; at least 24h (KRITIKA_TRANSCRIPT_RETENTION,
  # KRITIKA_DIFF_RETENTION).
  # transcriptRetention: 720h
  # diffRetention: 720h
  # A runner Job's deadline (KRITIKA_RUNNER_DEADLINE).
  # runnerDeadline: 15m
  # The RuntimeClass runner Jobs run under (KRITIKA_RUNNER_RUNTIME_CLASS),
  # e.g. gvisor or a Kata class; the cluster default unless set. Advised:
  # a runner parses untrusted repository content and runs what the model
  # asks.
  # runnerRuntimeClass: gvisor

# The configuration file (docs/configuration.md) holds what is reviewed and
# how: sign-in (`auth`), the GitHub `apps`, the instance's `providers`,
# `embedding` and `egress`, the `defaults` every repository gets, the
# `repositories` entries keyed `owner/*` or `owner/name`, and the
# `accounts` with their limits and providers. It is either inline as
# `configFile`, rendered into a chart-managed ConfigMap, or an existing
# ConfigMap with a `config.yaml` key. Secret material never goes in the
# file: it names environment variables, `{ env: NAME }`, which `env` and
# `envFrom` below set from existing Secrets. kritika reads the file at
# startup: the pods carry a checksum of `configFile`, so a change to it
# rolls them, while a change to an `existingConfigMap` needs a restart, for
# example by stakater's Reloader through `deploymentAnnotations`. The
# leader applies it to the store.

# -- (optional) The configuration file, as YAML: what is reviewed and how, from `auth` and `apps` to `repositories` and `accounts`. Passed through verbatim, not tpl'd. See docs/configuration.md.
configFile: {}
# apps:
#   github:
#     accounts: [org-1, user-1]
#     clientId: Iv1.example
#     privateKey: { env: GITHUB_APP_PRIVATE_KEY }
#     webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
# providers:
#   openrouter: { type: openrouter, apiKey: { env: OPENROUTER_API_KEY } }
# defaults:
#   models: { review: openrouter/vendor/large-model }

# -- Existing ConfigMap holding the file under the `config.yaml` key; takes precedence over `configFile`. A change to it takes a restart.
existingConfigMap: ""

# The variables the configuration file names as `{ env: NAME }`, from
# existing Secrets, and the KRITIKA_* variables that carry a secret
# themselves: the local admin's password, an OIDC client secret, a
# provider's API key. The variables that stand in for the file's sections
# (KRITIKA_AUTH_*, KRITIKA_APPS_*, KRITIKA_PROVIDERS_*, KRITIKA_DEFAULTS_*,
# KRITIKA_EMBEDDING_*) may be set here too; a variable wins over the file.
# The variables the chart derives from its other values (the addresses,
# the database, the config file, the runner image and ServiceAccount) and
# the ones `config` above has a key for cannot be set here; the chart
# refuses them. kritika drops every variable a secret came from from its
# own environment once read; runner pods never get them, each is handed
# its own per-run credentials.

# -- Environment variables of the kritika serve container, keyed by name: a plain value, or a map with the variable's `valueFrom` (a Secret, a ConfigMap or a field). Rendered through `tpl`.
env: {}
# KRITIKA_AUTH_ADMIN_PASSWORD:
#   valueFrom:
#     secretKeyRef: { name: kritika-admin, key: password }
# OPENROUTER_API_KEY:
#   valueFrom:
#     secretKeyRef: { name: kritika-openrouter, key: api-key }

# -- Secrets and ConfigMaps loaded as environment variables in bulk, each key a variable: the Kubernetes `envFrom` list. A Secret whose keys are the variable names the configuration file references sets them all at once.
envFrom: []
# - secretRef:
#     name: kritika-bot

# Three Postgres connection strings, each from its own Secret. The
# application role must not own the tables (row-level security), the owner
# role runs migrations and applies configuration on the leader, and the
# runner role is handed to runner Jobs and can only write its own run. On
# CloudNativePG, declare `app` and `runner` under `spec.managed.roles` and
# use the bootstrap owner as `owner`; see the README.
database:
  app:
    # -- (required) Secret holding the application role's connection URI.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
    # -- Name of the application role, asserted at startup (not superuser, no BYPASSRLS, owns nothing).
    role: kritika_app
  owner:
    # -- (required) Secret holding the owner role's connection URI, used only by the leader for migrations and configuration sync.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
  runner:
    # -- (required) Secret holding the runner role's connection URI; referenced by runner Jobs, never read by kritika serve.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
    # -- Name of the runner role, granted only what runner Jobs need.
    role: kritika_runner

# Runner Jobs: one pod per review or index run, created by kritika serve in the
# release namespace from the same image, running as a service account with
# no permissions and a database role that can only touch its own run. The
# server's Role reaches every Secret in the release namespace, so install
# kritika into a namespace of its own. Their deadline and RuntimeClass are
# `config.runnerDeadline` and `config.runnerRuntimeClass`; a sandboxed
# RuntimeClass (gVisor, Kata) is advised, since a runner parses untrusted
# repository content and runs what the model asks.
runner:
  # -- Image for runner Jobs; empty uses the chart's image. The release's `-tools` tag (e.g. `ghcr.io/home-operations/kritika:1.2.3-tools`) adds curl, fd, gh and rg for an agentic review's `agent.commands`.
  image: ""
  # -- How long a finished Job stays for kubectl before Kubernetes removes it (Go duration); the run row keeps everything the Job knew.
  ttl: 10m
  # -- Resources for runner pods (KRITIKA_RUNNER_RESOURCES), copied into the pod spec.
  resources: {}
  # -- Command-line tools a runner pod mounts from an image for the agent's run tool (KRITIKA_RUNNER_TOOLS), each a `name`, a digest-pinned `image`, the `path` of its binaries and the `commands` it provides. Needs Kubernetes 1.33 or newer, which mounts an image volume with a subPath; the chart refuses to render them on an older cluster.
  tools: []
  serviceAccount:
    # -- Create the runner ServiceAccount: no permissions, no token mounted, and the chart's `imagePullSecrets` so runner Jobs can pull from a private registry.
    create: true
    # -- Runner ServiceAccount name; generated from the release name if empty.
    name: ""
    # -- Annotations for the runner ServiceAccount.
    annotations: {}

serviceAccount:
  # -- Create the ServiceAccount kritika serve runs as.
  create: true
  # -- Automount the API token, which kritika serve needs to create runner Jobs.
  automount: true
  # -- Annotations for the ServiceAccount.
  annotations: {}
  # -- ServiceAccount name; generated from the release name if empty.
  name: ""

rbac:
  # -- Create the Role and RoleBinding kritika serve needs: Jobs in the release namespace, their pods and logs, and the Secrets it hands them. Nothing cluster-wide.
  create: true

# -- Annotations added to the Deployment (e.g. `reloader.stakater.com/auto: "true"`). Pod-level annotations go in `podAnnotations`.
deploymentAnnotations: {}
# -- Annotations added to the pods.
podAnnotations: {}
# -- Labels added to the pods.
podLabels: {}

# -- Pod-level securityContext (non-root uid/gid 65532, RuntimeDefault seccomp).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container securityContext (no privilege escalation, read-only root filesystem, drops ALL capabilities).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # -- Service type of the public Service.
  type: ClusterIP
  # -- Public port: the webhooks (`POST /hooks/{app}`) and the dashboard.
  port: 8080
  # -- Metrics and probe port.
  metricsPort: 8081
  # -- Port of the gateway the kritika serve pods run, on the pods and its Service: the forward proxy runner Jobs are handed as `HTTPS_PROXY`, allowing only the hosts the configuration names (github.com once an app is configured, `egress.allowHosts`), so runner pods need no direct internet egress, and the model and similar-code endpoints a runner calls with a per-run token, so no provider key enters a runner pod.
  gatewayPort: 8082

# One Ingress, or one Gateway API HTTPRoute, to the public Service, which
# serves the webhooks under `/hooks` and the dashboard. Its host must be
# `config.webUrl`'s: GitHub delivers webhooks to that URL and sign-in
# redirects back to it, so a route for another name serves a dashboard
# that cannot sign in.
ingress:
  # -- Expose the public Service through an Ingress.
  enabled: false
  # -- IngressClass name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hosts and their paths; the host is `config.webUrl`'s.
  hosts:
    - host: kritika.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration.
  tls: []
  # - secretName: kritika-tls
  #   hosts:
  #     - kritika.example.com

# Gateway API HTTPRoute, an alternative to `ingress`; one route to the public
# Service. Named `httpRoute`, not `route`, to keep clear of the OpenShift
# Route kind.
httpRoute:
  # -- Expose the public Service through a Gateway API HTTPRoute (alternative to ingress).
  enabled: false
  # -- HTTPRoute apiVersion; empty defaults to gateway.networking.k8s.io/v1.
  apiVersion: ""
  # -- HTTPRoute kind; empty defaults to HTTPRoute.
  kind: ""
  # -- HTTPRoute annotations.
  annotations: {}
  # -- HTTPRoute labels.
  labels: {}
  # -- Gateways (and listeners) this route attaches to.
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway
  #    sectionName: https

  # -- Hostnames matched against the Host header; `config.webUrl`'s host (templated).
  hostnames: []
  #  - kritika.example.com

  # -- Custom rules prepended before the default rule (templated).
  additionalRules: []
  # -- Filters applied to the default rule.
  filters: []
  # -- Match conditions for the default rule.
  matches:
    - path:
        type: PathPrefix
        value: /
  # Redirect HTTP to HTTPS (301) instead of routing to the backend. Requires
  # a Gateway with both HTTP and HTTPS listeners; matches/filters are ignored.

  # -- Redirect HTTP to HTTPS (301) instead of routing to the backend (needs HTTP+HTTPS listeners).
  httpsRedirect: false

# NetworkPolicies (off by default): one for the service pods (ingress to the
# webhook and metrics ports; egress to DNS, the forges and models over the
# egress ports, and Postgres) and one for runner pods (egress only: DNS, the
# git remote over the egress ports, and Postgres). The Postgres port is
# allowed to any peer because the database may live in another namespace.
networkPolicy:
  # -- Create the NetworkPolicies.
  enabled: false
  # -- Policy flavor for your CNI: "default" (networking.k8s.io/v1 NetworkPolicy), "cilium" (CiliumNetworkPolicy) or "calico" (projectcalico.org/v3 NetworkPolicy).
  type: default
  # -- Allow DNS egress (UDP/TCP 53); the Cilium flavor allows it to kube-dns alone.
  allowDNS: true
  # -- TCP ports the service pods may egress to for forges and model endpoints. Runner pods reach the gateway alone.
  egressPorts:
    - 443
  # -- Postgres port allowed for egress.
  postgresPort: 5432

# -- Resource requests and limits of the kritika serve pods.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Spread the kritika serve pods across nodes, so a node loss does not take both replicas: a soft constraint, so a one-node cluster still schedules them. Rendered through `tpl`; empty leaves scheduling to Kubernetes.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "kritika.name" . }}'
        app.kubernetes.io/instance: "{{ .Release.Name }}"

# -- Liveness probe, on the metrics port.
livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 20
# -- Readiness probe, on the metrics port. A replica is ready once its configuration file has loaded and its listeners are up, before the database answers: until it does, the dashboard shows that kritika is starting and webhooks are refused with a reason, from kritika rather than the ingress.
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  periodSeconds: 10
# -- Startup probe, on the metrics port. The liveness and readiness probes wait until it passes, so a pod still opening its listeners is not reported unready; it allows a minute.
startupProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 2
  failureThreshold: 30

# -- Grace period for a clean shutdown: kritika serve keeps accepting webhooks, dashboard requests and model steps for 5s while traffic moves off the pod, stops taking jobs and lets running ones finish for up to 100s, then retries the reviews it cut, and its gateway lets model steps in flight finish for up to 2m.
terminationGracePeriodSeconds: 150

monitoring:
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor for the metrics Service (requires its CRDs).
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- ServiceMonitor labels.
    labels: {}
    # -- ServiceMonitor annotations.
    annotations: {}
    # -- Prometheus metric relabelings.
    metricRelabelings: []
    # -- Prometheus relabelings.
    relabelings: []

podDisruptionBudget:
  # -- Create a PodDisruptionBudget when there is more than one replica.
  enabled: true
  # -- Minimum pods that must stay available, as a count or percentage. Used unless `maxUnavailable` is set.
  # @schema
  # type: [integer, string]
  # @schema
  minAvailable: ""
  # -- Maximum pods that may be unavailable, as a count or percentage; takes precedence over `minAvailable` when set.
  # @schema
  # type: [integer, string]
  # @schema
  maxUnavailable: 1

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
# -- PriorityClass for the pods. Empty uses the cluster default.
priorityClassName: ""

# -- Additional volumes on the Deployment.
volumes: []
# -- Additional volume mounts on the kritika serve container.
volumeMounts: []

# Config for the chart's `helm test` hook: a one-shot pod that curls the
# metrics Service's /readyz to prove the release serves. Used only by `helm
# test`, never the workload.
tests:
  image:
    # -- `helm test` connection-pod image; a gcr-mirrored curl, so the test never pulls from Docker Hub.
    repository: mirror.gcr.io/curlimages/curl
    # -- `helm test` image, pinned as `tag@sha256:digest` so Renovate bumps the tag and its digest together.
    tag: "8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777"
    # -- `helm test` image pull policy.
    pullPolicy: IfNotPresent
