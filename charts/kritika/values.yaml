---
# Default values for kritika.
#
# Most string, list and map values below are rendered through Helm's `tpl`, so
# they may carry template expressions that resolve at install time, e.g.
#   ingress.hosts[0].host: kritika.{{ .Values.global.domain }}
# Plain numbers and booleans, and `configFile`, are passed through as they are.

image:
  # -- Image repository.
  repository: ghcr.io/home-operations/kritika
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag; defaults to the chart appVersion.
  tag: ""
  # -- Pin the image by digest (sha256:…); when set, overrides the tag. The release pipeline fills it with the published image's digest.
  digest: ""

# -- Image pull secrets for private registries, for the kritika serve pods and, through the runner ServiceAccount, runner Jobs and the tool images they mount.
imagePullSecrets: []
# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""

# kritika runs as one Deployment of `kritika serve`: webhooks, the dashboard,
# the job queues, runner Jobs, the gateway and, on the replica holding the
# leader lock, the leader duties. Runner pods are not part of it: serve
# creates them as Jobs, one per review and index run.
# -- Replicas of kritika serve. Every replica serves webhooks and the dashboard and works jobs; exactly one holds the leader lock at a time. A rollout keeps one serving on its own; set 2 for one to keep serving while a pod or node is lost.
replicas: 1

# -- Deployment update strategy. A rolling update that surges one pod and takes none down keeps one replica serving while the other is replaced. Helm merges maps, so a switch to `Recreate` also sets `rollingUpdate: null`.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# How kritika runs and what it reviews with, as the KRITIKA_* variables
# (docs/configuration.md) keyed by their names without the prefix, in
# camelCase: `pollInterval` is KRITIKA_POLL_INTERVAL, `authOidcIssuer` is
# KRITIKA_AUTH_OIDC_ISSUER. The keys below are every variable that can be
# set; a key left empty sets nothing and kritika's own default applies,
# which each description names. A value is a plain value, rendered
# through `tpl`, or, for a secret, a map with the variable's `valueFrom`
# (a Secret key). The variables that stand in for the configuration
# file's sections (auth*, apps*, providers*, defaults*, embedding*) win
# over the file. The variables the chart derives from its other values
# (the addresses, the database, the config file, the runner image,
# ServiceAccount, TTL, resources and tools) cannot be set here; the chart
# refuses them, as it refuses a KRITIKA_* variable under `env`.
config:
  # -- (required) Public URL the dashboard is reached at, e.g. https://kritika.example.com; the webhooks share it under `/hooks/<app name>`. Must be an absolute http(s) URL with no query or fragment. GitHub delivers webhooks to it and sign-in redirects back to it, so the chart's Ingress or HTTPRoute must route this name.
  webUrl: ""
  # -- Log level: debug, info, warn or error.
  logLevel: info
  # -- Log format: json or text.
  logFormat: json
  # -- How often a replica retries the leader lock, and the holder checks it still has it; 15s unless set.
  leaderRetryInterval: ""
  # @schema
  # type: [integer, string]
  # @schema
  # -- Review jobs one replica runs at once, each holding a runner pod open; 2 unless set.
  reviewWorkers: ""
  # @schema
  # type: [integer, string]
  # @schema
  # -- Index jobs one replica runs at once, rate-limited apart from reviews so onboarding a large account cannot starve them; 1 unless set.
  indexWorkers: ""
  # -- How long a run's gateway token outlives its Job's deadline, in case the replica that minted it dies before revoking it; 1h unless set.
  gatewayTokenTtl: ""
  # -- How often the leader lists each app's open pull requests, its backstop for missed webhooks; `0s` turns it off; 10m unless set.
  pollInterval: ""
  # -- How far back a first or long-idle poll looks; 24h unless set.
  pollLookback: ""
  # @schema
  # type: [integer, string]
  # @schema
  # -- Onboarding index jobs the leader keeps queued or running at once; 4 unless set.
  onboardWindow: ""
  # -- How long the index of a repository that stopped running is kept; 720h unless set.
  indexGrace: ""
  # -- How long a review's full model transcript is kept, at least 24h; 720h unless set.
  transcriptRetention: ""
  # -- How long a review keeps the diff it was made from, the context it read and the repository files it named, at least 24h; 720h unless set.
  diffRetention: ""
  # -- A runner Job's deadline; 15m unless set.
  runnerDeadline: ""
  # -- RuntimeClass runner Jobs run under, e.g. `gvisor` or a Kata class; the cluster default unless set. Advised: a runner parses untrusted repository content and runs what the model asks.
  runnerRuntimeClass: ""

  # Sign-in (`auth` in the configuration file). The dashboard refuses to
  # start with no way to sign in, and the configuration is refused when
  # nothing could make an admin: an admin password, or a provider's role
  # mapping. A provider must allow the callback URL
  # <webUrl>/auth/callback/oidc or <webUrl>/auth/callback/github.

  # -- How long a dashboard session lasts, between 5m and 720h; 12h unless set.
  authSessionTtl: ""
  # -- The local admin's username; `admin` unless set.
  authAdminUser: ""
  # @schema
  # type: [string, object]
  # @schema
  # -- The local admin's password, from a Secret. The local admin exists only while one is set: the way into a fresh instance, and a way in when every provider is down.
  authAdminPassword: ""
  # -- Label of the OIDC provider on the sign-in page; "SSO" unless set.
  authOidcName: ""
  # -- OpenID Connect issuer, an https URL; set it to sign in through OIDC.
  authOidcIssuer: ""
  # -- OIDC client id.
  authOidcClientId: ""
  # @schema
  # type: [string, object]
  # @schema
  # -- OIDC client secret, from a Secret.
  authOidcClientSecret: ""
  # -- OIDC scopes, comma-separated; `openid,email,profile` unless set.
  authOidcScopes: ""
  # -- The ID token claim holding the person's roles or groups, read by `authOidcRoleMappingExpr`.
  authOidcRolesClaim: ""
  # -- CEL expression mapping an OIDC sign-in to a kritika role, `admin`, `member` or "" for none, e.g. `"kritika-admins" in roles ? "admin" : "member"`.
  authOidcRoleMappingExpr: ""
  # -- Role of an OIDC sign-in the mapping gives none; none unless set.
  authOidcDefaultRole: ""
  # -- Client id for signing in with GitHub: an OAuth App's, or the GitHub App's own; set it to sign in through GitHub.
  authGithubClientId: ""
  # @schema
  # type: [string, object]
  # @schema
  # -- Client secret for signing in with GitHub, from a Secret.
  authGithubClientSecret: ""
  # -- CEL expression mapping a GitHub sign-in to a kritika role, e.g. `login == "user-1" ? "admin" : ""`.
  authGithubRoleMappingExpr: ""

  # One GitHub App (an `apps` entry in the configuration file), which
  # replaces the file's app of the same name whole, or is added to them.

  # -- The app's name, which is its webhook path, `/hooks/<name>`; `github` unless set.
  appsName: ""
  # -- The users and organizations the app serves, comma-separated; set it to declare the app here.
  appsAccounts: ""
  # @schema
  # type: [string, object]
  # @schema
  # -- The GitHub App's client id, inline or from a Secret.
  appsClientId: ""
  # @schema
  # type: [string, object]
  # @schema
  # -- The GitHub App's private key (PEM), from a Secret.
  appsPrivateKey: ""
  # @schema
  # type: [string, object]
  # @schema
  # -- The GitHub App's webhook secret, from a Secret.
  appsWebhookSecret: ""

  # One model provider (a `providers` entry), which replaces the file's of
  # the same name whole or is added to them, the default models every
  # repository gets (`defaults`), and the embedder (`embedding`) that
  # builds each repository's similar-code index.

  # -- The provider's name, which models are addressed through as `<name>/<model>`; `openrouter` unless set.
  providersName: ""
  # -- The provider's type, `openrouter`, `openai` or `anthropic`; the name unless set, when the name is one of those.
  providersType: ""
  # -- The provider's base URL, for an OpenAI-compatible endpoint; the type's own unless set.
  providersBaseUrl: ""
  # @schema
  # type: [integer, string]
  # @schema
  # -- How many more times a review's model step is tried when the provider fails it in a way another attempt may not (a 5xx, a 429, a timeout), with backoff; 0 unless set, at most 5.
  providersRetries: ""
  # @schema
  # type: [string, object]
  # @schema
  # -- The provider's API key, from a Secret; set it to declare the provider here.
  providersApiKey: ""
  # -- The model every review runs on unless a repository names another, `<provider>/<model>`.
  defaultsModelsReview: ""
  # -- The model a review falls back to when the review model fails.
  defaultsModelsFallback: ""
  # -- How much a review says: `detailed` (nits, missing tests and questions inline), `standard` (nits in the summary only) or `minimal` (bugs, risks and breaking changes only); `standard` unless set.
  defaultsFeedback: ""
  # @schema
  # type: [boolean, string]
  # @schema
  # -- Review pull requests from forks without being asked; `false` unless set, when one is reviewed only when a maintainer comments `@<app slug> review`.
  defaultsForks: ""
  # -- How long a review waits after a push, so a burst of pushes collapses onto the last one before anything is spent, e.g. `30s`; immediate unless set.
  defaultsSettle: ""
  # -- The embedding model, `<provider>/<model>`; set it to index each repository for similar code.
  embeddingModel: ""
  # @schema
  # type: [integer, string]
  # @schema
  # -- The embedding's dimensions, which the model must produce.
  embeddingDims: ""

# The configuration file (docs/configuration.md) holds what is reviewed and
# how: sign-in (`auth`), the GitHub `apps`, the instance's `providers`,
# `embedding` and `egress`, the `defaults` every repository gets, the
# `repositories` entries keyed `owner/*` or `owner/name`, and the
# `accounts` with their limits and providers. It is either inline as
# `configFile`, rendered into a chart-managed ConfigMap, or an existing
# ConfigMap with a `config.yaml` key. Secret material never goes in the
# file: it names environment variables, `{ env: NAME }`, which `env` and
# `envFrom` below set from existing Secrets. kritika reads the file at
# startup: the pods carry a checksum of `configFile`, so a change to it
# rolls them, while a change to an `existingConfigMap` needs a restart, for
# example by stakater's Reloader through `deploymentAnnotations`. The
# leader applies it to the store.

# -- (optional) The configuration file, as YAML: what is reviewed and how, from `auth` and `apps` to `repositories` and `accounts`. Passed through verbatim, not tpl'd. See docs/configuration.md.
configFile: {}
# apps:
#   github:
#     accounts: [org-1, user-1]
#     clientId: Iv1.example
#     privateKey: { env: GITHUB_APP_PRIVATE_KEY }
#     webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
# providers:
#   openrouter: { type: openrouter, apiKey: { env: OPENROUTER_API_KEY } }
# defaults:
#   models: { review: openrouter/vendor/large-model }

# -- Existing ConfigMap holding the file under the `config.yaml` key; takes precedence over `configFile`. A change to it takes a restart.
existingConfigMap: ""

# The variables the configuration file names as `{ env: NAME }`, from
# existing Secrets, and anything else the container's environment needs.
# A KRITIKA_* variable does not go here: it is a key of `config`, and the
# chart refuses it under `env`, as it refuses the variables it derives
# from its other values. kritika drops every variable a secret came from
# from its own environment once read; runner pods never get them, each
# is handed its own per-run credentials.

# -- Environment variables of the kritika serve container, keyed by name: a plain value, or a map with the variable's `valueFrom` (a Secret, a ConfigMap or a field). Rendered through `tpl`.
env: {}
# GITHUB_APP_PRIVATE_KEY:
#   valueFrom:
#     secretKeyRef: { name: kritika-bot, key: private-key.pem }
# OPENROUTER_API_KEY:
#   valueFrom:
#     secretKeyRef: { name: kritika-openrouter, key: api-key }

# -- Secrets and ConfigMaps loaded as environment variables in bulk, each key a variable: the Kubernetes `envFrom` list. A Secret whose keys are the variable names the configuration file references sets them all at once.
envFrom: []
# - secretRef:
#     name: kritika-bot

# Three Postgres connection strings, each from its own Secret. The
# application role must not own the tables (row-level security), the owner
# role runs migrations and applies configuration on the leader, and the
# runner role is handed to runner Jobs and can only write its own run. On
# CloudNativePG, declare `app` and `runner` under `spec.managed.roles` and
# use the bootstrap owner as `owner`; see the README.
database:
  app:
    # -- (required) Secret holding the application role's connection URI.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
    # -- Name of the application role, asserted at startup (not superuser, no BYPASSRLS, owns nothing).
    role: kritika_app
  owner:
    # -- (required) Secret holding the owner role's connection URI, used only by the leader for migrations and configuration sync.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
  runner:
    # -- (required) Secret holding the runner role's connection URI; referenced by runner Jobs, never read by kritika serve.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
    # -- Name of the runner role, granted only what runner Jobs need.
    role: kritika_runner

# Runner Jobs: one pod per review or index run, created by kritika serve in the
# release namespace from the release's -tools image, running as a service
# account with no permissions and a database role that can only touch its own
# run. The server's Role reaches every Secret in the release namespace, so
# install kritika into a namespace of its own. Their deadline and RuntimeClass
# are `config.runnerDeadline` and `config.runnerRuntimeClass`; a sandboxed
# RuntimeClass (gVisor, Kata) is advised, since a runner parses untrusted
# repository content and runs what the model asks.
runner:
  # Image for runner Jobs: the release's `-tools` image, which adds curl, fd,
  # gh, jq, rg and yq for an agentic review's `agent.commands`.
  image:
    # -- Runner image repository.
    repository: ghcr.io/home-operations/kritika
    # -- Runner image pull policy (KRITIKA_RUNNER_IMAGE_PULL_POLICY).
    pullPolicy: IfNotPresent
    # -- Overrides the runner image tag; defaults to the chart appVersion with `-tools` appended.
    tag: ""
    # -- Pin the runner image by digest (sha256:…); when set, overrides the tag. The release pipeline fills it with the published `-tools` image's digest.
    digest: ""
  # -- How long a finished Job stays for kubectl before Kubernetes removes it (Go duration); the run row keeps everything the Job knew.
  ttl: 10m
  # -- Resources for runner pods (KRITIKA_RUNNER_RESOURCES), copied into the pod spec.
  resources: {}
  # -- Command-line tools a runner pod mounts from an image for the agent's run tool (KRITIKA_RUNNER_TOOLS), each a `name`, a digest-pinned `image`, the `path` of its binaries and the `commands` it provides. Needs Kubernetes 1.33 or newer, which mounts an image volume with a subPath; the chart refuses to render them on an older cluster.
  tools: []
  serviceAccount:
    # -- Create the runner ServiceAccount: no permissions, no token mounted, and the chart's `imagePullSecrets` so runner Jobs can pull from a private registry.
    create: true
    # -- Runner ServiceAccount name; generated from the release name if empty.
    name: ""
    # -- Annotations for the runner ServiceAccount.
    annotations: {}

serviceAccount:
  # -- Create the ServiceAccount kritika serve runs as.
  create: true
  # -- Automount the API token, which kritika serve needs to create runner Jobs.
  automount: true
  # -- Annotations for the ServiceAccount.
  annotations: {}
  # -- ServiceAccount name; generated from the release name if empty.
  name: ""

rbac:
  # -- Create the Role and RoleBinding kritika serve needs: Jobs in the release namespace, their pods and logs, and the Secrets it hands them. Nothing cluster-wide.
  create: true

# -- Annotations added to the Deployment (e.g. `reloader.stakater.com/auto: "true"`). Pod-level annotations go in `podAnnotations`.
deploymentAnnotations: {}
# -- Annotations added to the pods.
podAnnotations: {}
# -- Labels added to the pods.
podLabels: {}

# -- Pod-level securityContext (non-root uid/gid 65532, RuntimeDefault seccomp).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container securityContext (no privilege escalation, read-only root filesystem, drops ALL capabilities).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # -- Service type of the public Service.
  type: ClusterIP
  # -- Public port: the webhooks (`POST /hooks/{app}`) and the dashboard.
  port: 8080
  # -- Metrics and probe port.
  metricsPort: 8081
  # -- Port of the gateway the kritika serve pods run, on the pods and its Service: the forward proxy runner Jobs are handed as `HTTPS_PROXY`, allowing only the hosts the configuration names (github.com once an app is configured, `egress.allowHosts`), so runner pods need no direct internet egress, and the model and similar-code endpoints a runner calls with a per-run token, so no provider key enters a runner pod.
  gatewayPort: 8082

# One Ingress, or one Gateway API HTTPRoute, to the public Service, which
# serves the webhooks under `/hooks` and the dashboard. Its host must be
# `config.webUrl`'s: GitHub delivers webhooks to that URL and sign-in
# redirects back to it, so a route for another name serves a dashboard
# that cannot sign in.
ingress:
  # -- Expose the public Service through an Ingress.
  enabled: false
  # -- IngressClass name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hosts and their paths; the host is `config.webUrl`'s.
  hosts:
    - host: kritika.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration.
  tls: []
  # - secretName: kritika-tls
  #   hosts:
  #     - kritika.example.com

# Gateway API HTTPRoute, an alternative to `ingress`; one route to the public
# Service. Named `httpRoute`, not `route`, to keep clear of the OpenShift
# Route kind.
httpRoute:
  # -- Expose the public Service through a Gateway API HTTPRoute (alternative to ingress).
  enabled: false
  # -- HTTPRoute apiVersion; empty defaults to gateway.networking.k8s.io/v1.
  apiVersion: ""
  # -- HTTPRoute kind; empty defaults to HTTPRoute.
  kind: ""
  # -- HTTPRoute annotations.
  annotations: {}
  # -- HTTPRoute labels.
  labels: {}
  # -- Gateways (and listeners) this route attaches to.
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway
  #    sectionName: https

  # -- Hostnames matched against the Host header; `config.webUrl`'s host (templated).
  hostnames: []
  #  - kritika.example.com

  # -- Custom rules prepended before the default rule (templated).
  additionalRules: []
  # -- Filters applied to the default rule.
  filters: []
  # -- Match conditions for the default rule.
  matches:
    - path:
        type: PathPrefix
        value: /
  # Redirect HTTP to HTTPS (301) instead of routing to the backend. Requires
  # a Gateway with both HTTP and HTTPS listeners; matches/filters are ignored.

  # -- Redirect HTTP to HTTPS (301) instead of routing to the backend (needs HTTP+HTTPS listeners).
  httpsRedirect: false

# NetworkPolicies (off by default): one for the service pods (ingress to the
# webhook and metrics ports; egress to DNS, the forges and models over the
# egress ports, and Postgres) and one for runner pods (egress only: DNS, the
# git remote over the egress ports, and Postgres). The Postgres port is
# allowed to any peer because the database may live in another namespace.
networkPolicy:
  # -- Create the NetworkPolicies.
  enabled: false
  # -- Policy flavor for your CNI: "default" (networking.k8s.io/v1 NetworkPolicy), "cilium" (CiliumNetworkPolicy) or "calico" (projectcalico.org/v3 NetworkPolicy).
  type: default
  # -- Allow DNS egress (UDP/TCP 53); the Cilium flavor allows it to kube-dns alone.
  allowDNS: true
  # -- TCP ports the service pods may egress to for forges and model endpoints. Runner pods reach the gateway alone.
  egressPorts:
    - 443
  # -- Postgres port allowed for egress.
  postgresPort: 5432

# -- Resource requests and limits of the kritika serve pods.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Spread the kritika serve pods across nodes, so a node loss does not take both replicas: a soft constraint, so a one-node cluster still schedules them. Rendered through `tpl`; empty leaves scheduling to Kubernetes.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "kritika.name" . }}'
        app.kubernetes.io/instance: "{{ .Release.Name }}"

# -- Liveness probe, on the metrics port.
livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 20
# -- Readiness probe, on the metrics port. A replica is ready once its configuration file has loaded and its listeners are up, before the database answers: until it does, the dashboard shows that kritika is starting and webhooks are refused with a reason, from kritika rather than the ingress.
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  periodSeconds: 10
# -- Startup probe, on the metrics port. The liveness and readiness probes wait until it passes, so a pod still opening its listeners is not reported unready; it allows a minute.
startupProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 2
  failureThreshold: 30

# -- Grace period for a clean shutdown: kritika serve keeps accepting webhooks, dashboard requests and model steps for 5s while traffic moves off the pod, stops taking jobs and lets running ones finish for up to 100s, then retries the reviews it cut, and its gateway lets model steps in flight finish for up to 2m.
terminationGracePeriodSeconds: 150

monitoring:
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor for the metrics Service (requires its CRDs).
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- ServiceMonitor labels.
    labels: {}
    # -- ServiceMonitor annotations.
    annotations: {}
    # -- Prometheus metric relabelings.
    metricRelabelings: []
    # -- Prometheus relabelings.
    relabelings: []

podDisruptionBudget:
  # -- Create a PodDisruptionBudget when there is more than one replica.
  enabled: true
  # @schema
  # type: [integer, string]
  # @schema
  # -- Minimum pods that must stay available, as a count or percentage. Used unless `maxUnavailable` is set.
  minAvailable: ""
  # @schema
  # type: [integer, string]
  # @schema
  # -- Maximum pods that may be unavailable, as a count or percentage; takes precedence over `minAvailable` when set.
  maxUnavailable: 1

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
# -- PriorityClass for the pods. Empty uses the cluster default.
priorityClassName: ""

# -- Additional volumes on the Deployment.
volumes: []
# -- Additional volume mounts on the kritika serve container.
volumeMounts: []

# Config for the chart's `helm test` hook: a one-shot pod that curls the
# metrics Service's /readyz to prove the release serves. Used only by `helm
# test`, never the workload.
tests:
  image:
    # -- `helm test` connection-pod image; a gcr-mirrored curl, so the test never pulls from Docker Hub.
    repository: mirror.gcr.io/curlimages/curl
    # -- `helm test` image, pinned as `tag@sha256:digest` so Renovate bumps the tag and its digest together.
    tag: "8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777"
    # -- `helm test` image pull policy.
    pullPolicy: IfNotPresent
