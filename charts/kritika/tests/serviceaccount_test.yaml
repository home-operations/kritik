suite: serviceaccount
templates:
  - serviceaccount.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: creates the serve account with a token and the runner account without one
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika
        documentIndex: 0
      - equal:
          path: automountServiceAccountToken
          value: true
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika-runner
        documentIndex: 1
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 1
      - notExists:
          path: imagePullSecrets
        documentIndex: 1

  - it: hands runner Jobs the chart's pull secrets through their account
    set:
      imagePullSecrets: [{ name: "{{ .Release.Name }}-registry" }]
    asserts:
      - equal:
          path: imagePullSecrets
          value: [{ name: RELEASE-NAME-registry }]
        documentIndex: 1

  - it: renders only the runner account when the serve account is not created
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika-runner

  - it: renders only the serve account when the runner account is not created
    set:
      runner.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika

  - it: renders templated names (tpl contract)
    set:
      serviceAccount.name: "{{ .Release.Name }}-sa"
      runner.serviceAccount.name: "{{ .Release.Name }}-runner-sa"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-sa
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-runner-sa
        documentIndex: 1
