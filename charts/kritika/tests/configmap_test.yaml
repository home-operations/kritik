suite: configmap
templates:
  - configmap.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: renders the configuration file verbatim
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika
      - matchRegex:
          path: data["config.yaml"]
          pattern: "clientId: Iv1.example"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "env: GITHUB_APP_PRIVATE_KEY"

  - it: renders nothing when an existing ConfigMap is named
    set:
      config.existingConfigMap: my-config
    asserts:
      - hasDocuments:
          count: 0
