suite: dashboard
templates:
  - dashboard.tpl
  - grafanadashboard.tpl
values:
  - ../ci/lint-values.yaml
release:
  name: kritika
  namespace: kritika
tests:
  - it: renders none by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a sidecar ConfigMap when enabled
    set:
      monitoring.dashboards.enabled: true
    template: dashboard.tpl
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: kritika-dashboard
      - equal:
          path: metadata.namespace
          value: kritika
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - exists:
          path: data["kritika.json"]
      - matchRegex:
          path: data["kritika.json"]
          pattern: '"uid": "kritika-overview"'

  - it: renders no GrafanaDashboard without the operator flag
    set:
      monitoring.dashboards.enabled: true
    template: grafanadashboard.tpl
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a GrafanaDashboard for the grafana-operator
    set:
      monitoring.dashboards.enabled: true
      monitoring.dashboards.grafanaOperator.enabled: true
      monitoring.dashboards.grafanaOperator.folder: "{{ .Release.Name }}"
      monitoring.dashboards.grafanaOperator.matchLabels:
        dashboards: grafana
    template: grafanadashboard.tpl
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: GrafanaDashboard
      - equal:
          path: metadata.name
          value: kritika-dashboard
      - equal:
          path: spec.folder
          value: kritika
      - equal:
          path: spec.resyncPeriod
          value: 10m
      - equal:
          path: spec.allowCrossNamespaceImport
          value: true
      - equal:
          path: spec.instanceSelector.matchLabels.dashboards
          value: grafana
      - equal:
          path: spec.configMapRef.name
          value: kritika-dashboard
      - equal:
          path: spec.configMapRef.key
          value: kritika.json

  - it: refuses the operator without matchLabels
    set:
      monitoring.dashboards.enabled: true
      monitoring.dashboards.grafanaOperator.enabled: true
    template: grafanadashboard.tpl
    asserts:
      - failedTemplate:
          errorPattern: matchLabels must be set

  - it: drops the sidecar label when the operator imports the ConfigMap
    set:
      monitoring.dashboards.enabled: true
      monitoring.dashboards.grafanaOperator.enabled: true
      monitoring.dashboards.grafanaOperator.matchLabels:
        dashboards: grafana
    template: dashboard.tpl
    asserts:
      - notExists:
          path: metadata.labels.grafana_dashboard

  - it: honors a custom namespace, labels and annotations
    set:
      monitoring.dashboards.enabled: true
      monitoring.dashboards.namespace: monitoring
      monitoring.dashboards.labels: { team: "{{ .Release.Name }}" }
      monitoring.dashboards.annotations: { folder: kritika }
    template: dashboard.tpl
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: metadata.labels.team
          value: kritika
      - equal:
          path: metadata.annotations.folder
          value: kritika
