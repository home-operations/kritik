suite: pdb
templates:
  - pdb.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: keeps one of two replicas available
    set:
      replicas: 2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: server

  - it: uses minAvailable when maxUnavailable is unset
    set:
      replicas: 2
      podDisruptionBudget.maxUnavailable: ""
      podDisruptionBudget.minAvailable: 50%
    asserts:
      - equal:
          path: spec.minAvailable
          value: 50%
      - notExists:
          path: spec.maxUnavailable

  - it: prefers maxUnavailable when both are set
    set:
      replicas: 2
      podDisruptionBudget.minAvailable: 1
      podDisruptionBudget.maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: renders none for the default one replica
    asserts:
      - hasDocuments:
          count: 0

  - it: renders none when turned off
    set:
      replicas: 2
      podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0
