suite: configmap
templates:
  - configmap.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: renders the configuration file verbatim
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik
      - matchRegex:
          path: data["config.yaml"]
          pattern: "review: openrouter/openai/gpt-6-sol"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "filter: "

  - it: renders nothing when an existing ConfigMap is named
    set:
      config.existingConfigMap: my-config
    asserts:
      - hasDocuments:
          count: 0
