suite: services
templates:
  - service.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: renders the public, gateway and metrics Services, each selecting the server pods
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: kritik
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-gateway
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 8082
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-metrics
        documentIndex: 2

  - it: leaves the gateway Service out when the gateway is disabled
    set:
      gateway.enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-metrics
        documentIndex: 1
