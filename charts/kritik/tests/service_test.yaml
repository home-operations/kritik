suite: services
templates:
  - service.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: renders the webhook Service for hook-serving pods, the gateway Service for worker-capable pods and a metrics Service for all pods
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.selector["kritik.home-operations.com/hooks"]
          value: "true"
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-gateway
        documentIndex: 1
      - equal:
          path: spec.selector["kritik.home-operations.com/gateway"]
          value: "true"
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 8082
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-metrics
        documentIndex: 2
      - notExists:
          path: spec.selector["kritik.home-operations.com/hooks"]
        documentIndex: 2

  - it: renders the gateway and metrics Services for a worker-only topology
    set:
      roles.all.enabled: false
      roles.worker.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-gateway
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-metrics
        documentIndex: 1

  - it: leaves the gateway Service out when the gateway is disabled
    set:
      gateway.enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-metrics
        documentIndex: 1

  - it: renders a dashboard Service for the web role
    set:
      roles.all.enabled: false
      roles.web.enabled: true
      web.url: https://dash.example.com
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-web
        documentIndex: 0
      - equal:
          path: spec.ports[0].port
          value: 8083
        documentIndex: 0
      - equal:
          path: spec.ports[0].targetPort
          value: web
        documentIndex: 0
      - equal:
          path: spec.selector["kritik.home-operations.com/web"]
          value: "true"
        documentIndex: 0

  - it: renders the dashboard Service for the all role when web.url is set
    set:
      web.url: https://dash.example.com
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-web
        documentIndex: 2

  - it: leaves the dashboard Service out when web.url is unset
    asserts:
      - hasDocuments:
          count: 3
