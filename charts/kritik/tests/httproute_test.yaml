suite: httpRoute
templates:
  - httproute.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only the webhook HTTPRoute when enabled without a web role
    set:
      httpRoute.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-kritik
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080

  - it: leaves the dashboard HTTPRoute out until httpRoute.web.enabled is set, even with a web role
    set:
      roles.all.enabled: false
      roles.web.enabled: true
      web.url: https://dash.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the dashboard HTTPRoute when enabled with a web role
    set:
      roles.all.enabled: false
      roles.web.enabled: true
      web.url: https://dash.example.com
      httpRoute.web.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-web
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-kritik-web
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8083
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /

  - it: leaves the dashboard HTTPRoute out when httpRoute.web.enabled is set but no role serves the web UI
    set:
      httpRoute.web.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders both HTTPRoutes when the all role serves the dashboard
    set:
      web.url: https://dash.example.com
      httpRoute.enabled: true
      httpRoute.web.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-web
        documentIndex: 1
