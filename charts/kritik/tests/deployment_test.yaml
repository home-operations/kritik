suite: deployment
templates:
  - deployment.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: renders one Deployment for the all role by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_RUNNER_RUNTIME_CLASS
          any: true
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: all
      - equal:
          path: spec.template.metadata.labels["kritik.home-operations.com/hooks"]
          value: "true"
      - contains:
          path: spec.template.spec.containers[0].args
          content: all
      # The tag floats with the release-please-stamped appVersion.
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/home-operations/kritik:\d+\.\d+\.\d+$

  - it: wires the three database secrets and the runner settings for a worker-capable role
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: kritik-postgres-app
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_DATABASE_OWNER_URL
            valueFrom:
              secretKeyRef:
                name: kritik-postgres-credentials
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_RUNNER_DATABASE_SECRET
            value: kritik-postgres-runner
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_RUNNER_SERVICE_ACCOUNT
            value: RELEASE-NAME-kritik-runner
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_EXECUTOR
            value: kubernetes

  - it: mounts the config and every secretMount read-only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/kritik
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: bot
            mountPath: /var/run/secrets/kritik/bot
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: providers
            secret:
              secretName: kritik-providers

  - it: leaves the embedder out until a model is set
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_EMBED_MODEL
            value: voyageai/voyage-code-4
          any: true

  - it: sets the embedder from an existing secret
    set:
      embedding.model: voyageai/voyage-code-4
      embedding.existingSecret: kritik-providers
      embedding.existingSecretKey: openrouter-api-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_EMBED_MODEL
            value: voyageai/voyage-code-4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_EMBED_API_KEY
            valueFrom:
              secretKeyRef:
                name: kritik-providers
                key: openrouter-api-key

  - it: fails when a model is set without a key
    set:
      embedding.model: voyageai/voyage-code-4
    asserts:
      - failedTemplate:
          errorPattern: embedding.model is set but no key

  - it: renders the split topology with an ingest and a worker Deployment
    set:
      roles.all.enabled: false
      roles.ingest.enabled: true
      roles.worker.enabled: true
      roles.worker.resources:
        limits:
          memory: 2Gi
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-ingest
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritik-worker
        documentIndex: 1
      # Ingest never sees the owner DSN or the runner settings.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_EXECUTOR
            value: kubernetes
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_EXECUTOR
            value: kubernetes
        documentIndex: 1
      # The worker has no http port and is not selected by the webhook Service.
      - notExists:
          path: spec.template.metadata.labels["kritik.home-operations.com/hooks"]
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
        documentIndex: 1

  - it: refuses all together with a split role
    set:
      roles.worker.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: single-process topology

  - it: refuses a worker-capable role without the owner secret
    set:
      database.owner.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: database.owner.existingSecret is required

  - it: prefers the digest over the tag when set
    set:
      image.digest: sha256:deadbeef
      image.tag: ignored
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/home-operations/kritik@sha256:deadbeef
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_RUNNER_IMAGE
            value: ghcr.io/home-operations/kritik@sha256:deadbeef

  - it: hands the worker a runner RuntimeClass only when one is set
    set:
      runner.runtimeClassName: gvisor
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIK_RUNNER_RUNTIME_CLASS
            value: gvisor
