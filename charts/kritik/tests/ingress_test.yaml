suite: ingress
templates:
  - ingress.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes web.url to the public Service, which serves the webhooks and the dashboard
    set:
      ingress.enabled: true
      ingress.className: nginx
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: kritik.example.com
      - equal:
          path: spec.rules[0].http.paths
          value:
            - path: /
              pathType: Prefix
              backend: { service: { name: RELEASE-NAME-kritik, port: { name: http } } }

  - it: keeps web.url's path and drops its port
    set:
      ingress.enabled: true
      web.url: https://kritik.example.com:8443/kritik/
    asserts:
      - equal:
          path: spec.rules[0].host
          value: kritik.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /kritik
