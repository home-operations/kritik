suite: networkPolicy
templates:
  - networkpolicy.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a policy for the service pods and one for runner pods
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 8080
            protocol: TCP
        documentIndex: 0
      - contains:
          path: spec.egress[1].ports
          content:
            port: 5432
            protocol: TCP
        documentIndex: 0
      - equal:
          path: spec.podSelector.matchLabels["kritik.home-operations.com/role"]
          value: runner
        documentIndex: 1
      - notExists:
          path: spec.ingress
        documentIndex: 1
      # With the gateway, runners reach only DNS, Postgres and the gateway
      # port on gateway pods: no 443 to anywhere.
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["kritik.home-operations.com/role"]
          value: runner
        documentIndex: 0
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 8082
        documentIndex: 0
      - notContains:
          path: spec.egress[1].ports
          content:
            port: 443
            protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[2].to[0].podSelector.matchLabels
          value:
            app.kubernetes.io/name: kritik
            app.kubernetes.io/instance: RELEASE-NAME
        documentIndex: 1
      - equal:
          path: spec.egress[2].ports[0].port
          value: 8082
        documentIndex: 1

  - it: gives runners direct egress on the egress ports when the gateway is disabled
    set:
      networkPolicy.enabled: true
      gateway.enabled: false
    asserts:
      - contains:
          path: spec.egress[1].ports
          content:
            port: 443
            protocol: TCP
        documentIndex: 1
      - notExists:
          path: spec.egress[2]
        documentIndex: 1
      - notExists:
          path: spec.ingress[1]
        documentIndex: 0

  - it: renders CiliumNetworkPolicies for type=cilium, with the gateway open to runner pods alone
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: cilium.io/v2
      - isKind:
          of: CiliumNetworkPolicy
      - contains:
          path: spec.ingress[0].fromEntities
          content: all
        documentIndex: 0
      - equal:
          path: spec.ingress[1].fromEndpoints[0].matchLabels["kritik.home-operations.com/role"]
          value: runner
        documentIndex: 0
      - equal:
          path: spec.ingress[1].toPorts[0].ports[0].port
          value: "8082"
        documentIndex: 0
      # DNS to kube-dns alone, then the egress ports and Postgres, then the API server.
      - equal:
          path: spec.egress[0].toEndpoints[0].matchLabels["k8s-app"]
          value: kube-dns
        documentIndex: 0
      - contains:
          path: spec.egress[1].toEntities
          content: world
        documentIndex: 0
      - contains:
          path: spec.egress[1].toPorts[0].ports
          content:
            port: "5432"
            protocol: TCP
        documentIndex: 0
      - contains:
          path: spec.egress[2].toEntities
          content: kube-apiserver
        documentIndex: 0
      # Runners: default deny on ingress, no 443 to the world, the gateway on the server pods.
      - equal:
          path: spec.ingress
          value:
            - {}
        documentIndex: 1
      - notContains:
          path: spec.egress[1].toPorts[0].ports
          content:
            port: "443"
            protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[2].toEndpoints[0].matchLabels
          value:
            app.kubernetes.io/name: kritik
            app.kubernetes.io/instance: RELEASE-NAME
        documentIndex: 1
      - equal:
          path: spec.egress[2].toPorts[0].ports[0].port
          value: "8082"
        documentIndex: 1

  - it: renders Calico NetworkPolicies for type=calico, denying runner ingress by listing it with no rules
    set:
      networkPolicy.enabled: true
      networkPolicy.type: calico
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: projectcalico.org/v3
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.selector
          value: app.kubernetes.io/name == 'kritik' && app.kubernetes.io/instance == 'RELEASE-NAME'
        documentIndex: 0
      - equal:
          path: spec.ingress[1].source.selector
          value: kritik.home-operations.com/role == 'runner'
        documentIndex: 0
      - contains:
          path: spec.egress[2].destination.ports
          content: 5432
        documentIndex: 0
      - contains:
          path: spec.egress[3].destination.ports
          content: 6443
        documentIndex: 0
      - equal:
          path: spec.types
          value: [Ingress, Egress]
        documentIndex: 1
      - notExists:
          path: spec.ingress
        documentIndex: 1
      - notContains:
          path: spec.egress[2].destination.ports
          content: 443
        documentIndex: 1
      - equal:
          path: spec.egress[3].destination.selector
          value: app.kubernetes.io/name == 'kritik' && app.kubernetes.io/instance == 'RELEASE-NAME'
        documentIndex: 1

  - it: gives runners the egress ports in every flavor when the gateway is disabled
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
      gateway.enabled: false
    asserts:
      - contains:
          path: spec.egress[1].toPorts[0].ports
          content:
            port: "443"
            protocol: TCP
        documentIndex: 1
      - notExists:
          path: spec.egress[2]
        documentIndex: 1
      - notExists:
          path: spec.ingress[1]
        documentIndex: 0

  - it: fails fast on an unknown type
    set:
      networkPolicy.enabled: true
      networkPolicy.type: bogus
    asserts:
      - failedTemplate:
          errorMessage: 'networkPolicy.type must be one of: default, cilium, calico (got "bogus")'
