suite: networkPolicy
templates:
  - networkpolicy.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a policy for the service pods and one for runner pods
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 8080
            protocol: TCP
        documentIndex: 0
      - contains:
          path: spec.egress[1].ports
          content:
            port: 5432
            protocol: TCP
        documentIndex: 0
      - equal:
          path: spec.podSelector.matchLabels["kritik.home-operations.com/role"]
          value: runner
        documentIndex: 1
      - notExists:
          path: spec.ingress
        documentIndex: 1
      # With the gateway, runners reach only DNS, Postgres and the gateway
      # port on gateway pods: no 443 to anywhere.
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["kritik.home-operations.com/role"]
          value: runner
        documentIndex: 0
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 8082
        documentIndex: 0
      - notContains:
          path: spec.egress[1].ports
          content:
            port: 443
            protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[2].to[0].podSelector.matchLabels["kritik.home-operations.com/gateway"]
          value: "true"
        documentIndex: 1
      - equal:
          path: spec.egress[2].ports[0].port
          value: 8082
        documentIndex: 1

  - it: leaves the dashboard port out of ingress when no role serves the web UI
    set:
      networkPolicy.enabled: true
    asserts:
      - notContains:
          path: spec.ingress[0].ports
          content:
            port: 8083
            protocol: TCP
        documentIndex: 0

  - it: allows ingress to the dashboard port when a role serves the web UI
    set:
      networkPolicy.enabled: true
      web.url: https://dash.example.com
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 8083
            protocol: TCP
        documentIndex: 0

  - it: opens the port the web container listens on, not the Service's
    set:
      networkPolicy.enabled: true
      web.url: https://dash.example.com
      web.port: 9000
      service.webPort: 80
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 9000
            protocol: TCP
        documentIndex: 0
      - notContains:
          path: spec.ingress[0].ports
          content:
            port: 80
            protocol: TCP
        documentIndex: 0

  - it: gives runners direct egress on the egress ports when the gateway is disabled
    set:
      networkPolicy.enabled: true
      gateway.enabled: false
    asserts:
      - contains:
          path: spec.egress[1].ports
          content:
            port: 443
            protocol: TCP
        documentIndex: 1
      - notExists:
          path: spec.egress[2]
        documentIndex: 1
      - notExists:
          path: spec.ingress[1]
        documentIndex: 0
