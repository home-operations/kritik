suite: test-connection
templates:
  - tests/test-connection.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: is a hardened helm test Pod that probes /readyz on the metrics Service with the tag+digest-pinned curl
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - matchRegex:
          path: spec.containers[0].image
          pattern: curlimages/curl:.+@sha256:[0-9a-f]{64}$
      - equal:
          path: spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.containers[0].args
          content: http://RELEASE-NAME-kritik-metrics:8081/readyz

  - it: follows the metrics port
    set:
      service.metricsPort: 9090
    asserts:
      - contains:
          path: spec.containers[0].args
          content: http://RELEASE-NAME-kritik-metrics:9090/readyz
