---
# Default values for kritik.
#
# Most string, list and map values below are rendered through Helm's `tpl`, so
# they may carry template expressions that resolve at install time, e.g.
#   ingress.hosts[0].host: kritik.{{ .Values.global.domain }}
# Plain numbers and booleans, and `config.file`, are passed through as they are.

image:
  # -- Image repository.
  repository: ghcr.io/home-operations/kritik
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag; defaults to the chart appVersion.
  tag: ""
  # -- Pin the image by digest (sha256:…); when set, overrides the tag. The release pipeline fills it with the published image's digest.
  digest: ""

# -- Image pull secrets for private registries.
imagePullSecrets: []
# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""

# kritik is one binary with four roles. `all` runs ingest, worker and the
# dashboard in one process (the usual shape); a split topology enables
# `ingest`, `worker` and `web` separately and scales each. Every enabled role
# renders its own Deployment from the same image, config and secrets. Runner
# pods are not a role here: the worker creates them as Jobs per review and
# index.
roles:
  all:
    # -- Run the single-process topology: webhooks, leader duties, the worker and the dashboard in one Deployment.
    enabled: true
    # -- Replicas. Any replica can serve webhooks and work jobs; exactly one holds the leader lock at a time.
    replicas: 1
    # -- Resources for this role's pods; empty falls back to `resources`.
    resources: {}
  ingest:
    # -- Run webhook ingest as its own Deployment (split topology).
    enabled: false
    # -- Replicas for the ingest Deployment.
    replicas: 2
    # -- Resources for this role's pods; empty falls back to `resources`.
    resources: {}
  worker:
    # -- Run the worker (queues, runner Jobs, leader duties) as its own Deployment (split topology).
    enabled: false
    # -- Replicas for the worker Deployment.
    replicas: 1
    # -- Resources for this role's pods; empty falls back to `resources`.
    resources: {}
  web:
    # -- Run the dashboard as its own Deployment (split topology, where it is required: kritik is configured there).
    enabled: false
    # -- Replicas for the web Deployment.
    replicas: 1
    # -- Resources for this role's pods; empty falls back to `resources`.
    resources: {}

# The one public URL: the dashboard at `web.url`, and the webhook listener
# under it at `/hooks`, which the Ingress or HTTPRoute below route.
web:
  # -- (required) Public URL the dashboard is reached at, e.g. https://kritik.example.com; the webhook listener shares it under `/hooks`, and the GitHub Apps the dashboard creates send their webhooks there. Must be an absolute http(s) URL with no query or fragment.
  url: ""
  # -- Dashboard port, served by `all` and `web` pods.
  port: 8083

# How people sign in (see docs/configuration.md), rendered to the
# KRITIK_AUTH_* variables, which win over the configuration file's `auth`
# block. Each is left out when empty; secrets come from existing Secrets.
auth:
  # -- How long a dashboard session lasts (Go duration, 5m to 720h); empty is 12h.
  sessionTTL: ""
  admin:
    # -- The local admin's username; empty is `admin`.
    user: ""
    passwordSecret:
      # -- Existing Secret holding the local admin's password; the local admin exists only while one is set.
      name: ""
      # -- Key in that Secret.
      key: password
  oidc:
    # -- The sign-in button's label; empty is "SSO".
    name: ""
    # -- OIDC issuer (https); set, with a client, to sign in through it.
    issuer: ""
    # -- OAuth client ID at the issuer.
    clientId: ""
    clientSecretSecret:
      # -- Existing Secret holding the client secret.
      name: ""
      # -- Key in that Secret.
      key: client-secret
    # -- Scopes to request; empty is openid, email and profile.
    scopes: []
    # -- ID token or UserInfo claim a role mapping reads as `roles`.
    rolesClaim: ""
    # -- CEL expression giving a role, or a map of accounts to roles (docs/configuration.md).
    roleMapping: ""
    # -- Role when the mapping places nobody: none (the default) or member.
    defaultRole: ""
  github:
    # -- Client ID of an OAuth App, or of a GitHub App, to sign in with GitHub.
    clientId: ""
    clientSecretSecret:
      # -- Existing Secret holding the client secret.
      name: ""
      # -- Key in that Secret.
      key: client-secret
    # -- CEL expression giving a role, or a map of accounts to roles.
    roleMapping: ""

# The configuration file holds the whole configuration (ADR-0019,
# ADR-0021): sign-in (`auth`), the GitHub `apps`, the instance's
# `providers`, `embedding` and `egress`, the `defaults` every repository
# gets, the `repositories` entries keyed `owner/*` or `owner/name`, and the
# `accounts` with their limits and providers. Sign-in, one app, one
# provider, the default models and review settings and the embedder also
# have `KRITIK_*` environment variables, which win over the file; the
# `auth` values above render some, and `extraEnv` can set the others. The
# file is either inline as `file`, rendered into a chart-managed ConfigMap,
# or an existing ConfigMap with a `config.yaml` key. Secret material never
# goes in the file: it references files under `secretMounts` or environment
# variables. Every replica re-reads the file on `reloadInterval`; the
# leader applies it to the store.
config:
  # -- (optional) The configuration file, as YAML: the whole configuration, from `auth` and `apps` to `repositories` and `accounts`. Passed through verbatim, not tpl'd. See docs/configuration.md.
  file: {}
  # apps:
  #   - name: github
  #     accounts: [org-1, user-1]
  #     clientId: Iv1.example
  #     privateKey: { file: /var/run/secrets/kritik/bot/private-key.pem }
  #     webhookSecret: { file: /var/run/secrets/kritik/bot/webhook-secret }
  # providers:
  #   openrouter: { type: openrouter, apiKey: { file: /var/run/secrets/kritik/openrouter/api-key } }
  # defaults:
  #   models: { review: openrouter/vendor/large-model }

  # -- Existing ConfigMap holding the file under the `config.yaml` key; takes precedence over `file`.
  existingConfigMap: ""
  # -- How often each replica re-reads the file (Go duration).
  reloadInterval: 10s
  # -- How often the leader lists each app's open pull requests, its backstop for missed webhooks (KRITIK_POLL_INTERVAL, Go duration); `0s` turns polling off. Empty is kritik's default, 10m.
  pollInterval: ""
  # -- How far back a first or long-idle poll looks (KRITIK_POLL_LOOKBACK, Go duration). Empty is kritik's default, 24h.
  pollLookback: ""
  # -- How many onboarding index jobs the leader keeps queued or running at once (KRITIK_ONBOARD_WINDOW). 0 is kritik's default, 4.
  onboardWindow: 0
  # -- How long the index of a repository that stopped running is kept (KRITIK_INDEX_GRACE, Go duration). Empty is kritik's default, 720h.
  indexGrace: ""
  # -- How long an agentic review's transcript is kept, at least 24h (KRITIK_TRANSCRIPT_RETENTION, Go duration). Empty is kritik's default, 720h.
  transcriptRetention: ""
  # -- Log level: debug, info, warn or error.
  logLevel: info
  # -- Log format: json or text.
  logFormat: json
  # -- Review jobs one worker replica runs at once (KRITIK_REVIEW_WORKERS); follow-ups share the count. A review or index job holds at most one runner pod, so runner pods never exceed the replicas working jobs × (reviewWorkers + indexWorkers).
  reviewWorkers: 2
  # -- Index jobs one worker replica runs at once (KRITIK_INDEX_WORKERS), rate-limited apart from reviews.
  indexWorkers: 1
  # -- Extra raw env vars merged into every role's container (advanced).
  extraEnv: []
  # - name: KRITIK_LEADER_RETRY_INTERVAL
  #   value: 30s

# Three Postgres connection strings, each from its own Secret. The
# application role must not own the tables (row-level security), the owner
# role runs migrations and applies configuration on the leader, and the
# runner role is handed to runner Jobs and can only write its own run. On
# CloudNativePG, declare `app` and `runner` under `spec.managed.roles` and
# use the bootstrap owner as `owner`; see the README.
database:
  app:
    # -- (required) Secret holding the application role's connection URI.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
    # -- Name of the application role, asserted at startup (not superuser, no BYPASSRLS, owns nothing).
    role: kritik_app
  owner:
    # -- (required for roles.all / roles.worker) Secret holding the owner role's connection URI, used only by the leader for migrations and configuration sync.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
  runner:
    # -- (required for roles.all / roles.worker) Secret holding the runner role's connection URI; referenced by runner Jobs, never read by the worker.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
    # -- Name of the runner role, granted only what runner Jobs need.
    role: kritik_runner

# Secrets the configuration file references by path (GitHub App private keys
# and webhook secrets, sign-in secrets). Each entry mounts one Secret,
# read-only, at `mountPath` in every role's pods; the file then points at
# `<mountPath>/<key>`.
# -- Secrets mounted as files for the configuration file to reference.
secretMounts: []
# - name: bot
#   secretName: kritik-bot
#   mountPath: /var/run/secrets/kritik/bot
# - name: auth
#   secretName: kritik-auth
#   mountPath: /var/run/secrets/kritik/auth

# Runner Jobs: one pod per review or index run, created by the worker in the
# release namespace from the same image, running as a service account with
# no permissions and a database role that can only touch its own run. The
# worker's Role reaches every Secret in the release namespace, so install
# kritik into a namespace of its own.
runner:
  # -- Image for runner Jobs; empty uses the chart's image. The release's `-tools` tag (e.g. `ghcr.io/home-operations/kritik:1.2.3-tools`) adds curl, fd and rg for an agentic review's `agent.commands`.
  image: ""
  # -- How long a finished Job stays for kubectl before Kubernetes removes it (Go duration); the run row keeps everything the Job knew.
  ttl: 1h
  # -- Deadline of a runner Job (KRITIK_RUNNER_DEADLINE, Go duration). Empty is kritik's default, 15m.
  deadline: ""
  # -- Resources for runner pods (KRITIK_RUNNER_RESOURCES), copied into the pod spec.
  resources: {}
  # -- Command-line tools a runner pod mounts from an image for the agent's run tool (KRITIK_RUNNER_TOOLS, ADR-0011), each a `name`, a digest-pinned `image`, the `path` of its binaries and the `commands` it provides.
  tools: []
  # -- RuntimeClass for runner Jobs (e.g. `gvisor`, `kata`). Advised: a runner parses untrusted repository content and, in agentic mode, runs what the model asks; a sandboxed runtime keeps it from the node's kernel. Empty uses the cluster default.
  runtimeClassName: ""
  serviceAccount:
    # -- Create the runner ServiceAccount (no permissions, no token mounted).
    create: true
    # -- Runner ServiceAccount name; generated from the release name if empty.
    name: ""
    # -- Annotations for the runner ServiceAccount.
    annotations: {}

gateway:
  # -- Serve the gateway on `all` and `worker` pods: the forward proxy runner Jobs are handed as `HTTPS_PROXY`, allowing only the hosts the configuration names (github.com once a connection exists, `egress.allowHosts`), so runner pods need no direct internet egress (ADR-0008), and the model endpoint an agentic runner calls with a per-run token, so no provider key enters a runner pod (ADR-0004). Agentic reviews, the default mode, are refused without it: set `KRITIK_DEFAULTS_MODE=single` (or `defaults.mode: single`) before turning it off.
  enabled: true
  # -- Gateway port on the pods and its Service.
  port: 8082

serviceAccount:
  # -- Create the ServiceAccount the roles run as.
  create: true
  # -- Automount the API token. The worker needs it to create runner Jobs; a pure ingest topology could turn it off.
  automount: true
  # -- Annotations for the ServiceAccount.
  annotations: {}
  # -- ServiceAccount name; generated from the release name if empty.
  name: ""

rbac:
  # -- Create the Role and RoleBinding the worker needs: Jobs in the release namespace, their pods and logs, and the Secrets it hands them. Nothing cluster-wide.
  create: true

# -- Annotations added to every Deployment (e.g. `reloader.stakater.com/auto: "true"`). Pod-level annotations go in `podAnnotations`.
deploymentAnnotations: {}
# -- Annotations added to the pods.
podAnnotations: {}
# -- Labels added to the pods.
podLabels: {}

# -- Pod-level securityContext (non-root uid/gid 65532, RuntimeDefault seccomp).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container securityContext (no privilege escalation, read-only root filesystem, drops ALL capabilities).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # -- Service type for the webhook listener.
  type: ClusterIP
  # -- Webhook port (`POST /hooks/{connection}`), served by `all` and `ingest` pods.
  port: 8080
  # -- Metrics and probe port, served by every pod.
  metricsPort: 8081
  # -- Dashboard port, served by `all` and `web` pods.
  webPort: 8083

# One Ingress, or one Gateway API HTTPRoute, for `web.url`: `/hooks` under it
# goes to the webhook listener and everything else to the dashboard. The host
# and paths come from `web.url`.
ingress:
  # -- Expose web.url through an Ingress.
  enabled: false
  # -- IngressClass name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress TLS configuration, e.g. `[{hosts: [kritik.example.com], secretName: kritik-tls}]`.
  tls: []

httpRoute:
  # -- Expose web.url through a Gateway API HTTPRoute.
  enabled: false
  # -- HTTPRoute apiVersion; empty defaults to gateway.networking.k8s.io/v1.
  apiVersion: ""
  # -- HTTPRoute annotations.
  annotations: {}
  # -- HTTPRoute labels.
  labels: {}
  # -- Gateways (and listeners) this route attaches to.
  parentRefs: []

# NetworkPolicies (off by default): one for the service pods (ingress to the
# webhook and metrics ports; egress to DNS, the forges and models over the
# egress ports, and Postgres) and one for runner pods (egress only: DNS, the
# git remote over the egress ports, and Postgres). The Postgres port is
# allowed to any peer because the database may live in another namespace.
networkPolicy:
  # -- Create the NetworkPolicies.
  enabled: false
  # -- Allow DNS egress (UDP/TCP 53).
  allowDNS: true
  # -- TCP ports the service pods may egress to for forges and model endpoints. Runner pods get these only when the gateway is disabled; with it, they reach the gateway alone.
  egressPorts:
    - 443
  # -- Postgres port allowed for egress.
  postgresPort: 5432

# -- Pod resource requests/limits shared by every role; `roles.<role>.resources` overrides per role.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Liveness probe, on the metrics port.
livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 20
# -- Readiness probe, on the metrics port. A replica is ready once it has a database connection and its listeners are up.
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  periodSeconds: 10
# -- Startup probe, on the metrics port. The liveness and readiness probes wait until it passes, so a pod still opening its listeners is not reported unready; it allows a minute.
startupProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 2
  failureThreshold: 30

# -- Grace period for a clean shutdown: the worker stops taking jobs and lets running ones finish for up to 30s, and its gateway lets model steps in flight finish for up to 2m.
terminationGracePeriodSeconds: 150

monitoring:
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor for every role's metrics (requires its CRDs).
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- ServiceMonitor labels.
    labels: {}
    # -- ServiceMonitor annotations.
    annotations: {}
    # -- Prometheus metric relabelings.
    metricRelabelings: []
    # -- Prometheus relabelings.
    relabelings: []

podDisruptionBudget:
  # -- Create a PodDisruptionBudget per role with more than one replica.
  enabled: false
  # -- Maximum pods of a role that may be unavailable, as a count or percentage.
  # @schema
  # type: [integer, string]
  # @schema
  maxUnavailable: 1

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
# -- PriorityClass for the pods. Empty uses the cluster default.
priorityClassName: ""

# -- Additional volumes on every Deployment.
volumes: []
# -- Additional volume mounts on every container.
volumeMounts: []
