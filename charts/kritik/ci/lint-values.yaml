---
# Values that make the chart render without a real cluster: helm lint,
# helm template and CI use them. Nothing here is a working configuration.
database:
  app:
    existingSecret: kritik-postgres-app
  owner:
    existingSecret: kritik-postgres-credentials
  runner:
    existingSecret: kritik-postgres-runner
config:
  file:
    auth:
      admin:
        password: { file: /var/run/secrets/kritik/auth/admin-password }
    connections:
      - name: github
        forge: github
        accounts: [org-1]
        app:
          clientId: Iv1.example
          privateKey: { file: /var/run/secrets/kritik/bot/private-key.pem }
          webhookSecret: { file: /var/run/secrets/kritik/bot/webhook-secret }
secretMounts:
  - name: bot
    secretName: kritik-bot
    mountPath: /var/run/secrets/kritik/bot
  - name: auth
    secretName: kritik-auth
    mountPath: /var/run/secrets/kritik/auth
