# Stamped by release-please on every release so a git-sourced install deploys a
# real image tag (the release workflow re-stamps both at package time anyway;
# these keep the repo copy from going stale).
version: 0.1.0 # x-release-please-version
appVersion: "0.1.0" # x-release-please-version
home: https://github.com/home-operations/kritik
sources:
  - https://github.com/home-operations/kritik
maintainers:
  - name: home-operations
    email: contact@home-operations.com
keywords:
  - code-review
  - pull-request
  - github
  - llm
  - kubernetes
annotations:
  category: Infrastructure
