apps:
  - name: sticky-gecko
    accounts: [home-operations]
    clientId: Iv1.xxxxxxxx
    privateKey: { env: TEST_PRIVATE_KEY }
    webhookSecret: { env: TEST_WEBHOOK_SECRET }
  - name: bot-ross
    accounts: [onedr0p]
    clientId: { env: TEST_CLIENT_ID }
    privateKey: { env: TEST_PRIVATE_KEY }
    webhookSecret: { env: TEST_WEBHOOK_SECRET }

providers:
  openrouter:
    type: openrouter
    apiKey: { env: TEST_OPENROUTER_API_KEY }
  local:
    type: openai
    baseUrl: http://litellm.ai.svc:4000/v1
    apiKey: { env: TEST_LOCAL_KEY }

defaults:
  models:
    review: openrouter/openai/gpt-6-sol
    fallback: local/claude-sonnet-5
  filterExpr: "!pr.draft"
  forks: false
  limits:
    concurrency: 3

repositories:
  home-operations/flate:
    ignore:
      - "**/testdata/**"
    settle: 30s
  home-operations/kopiur:
    filterExpr: '!pr.draft && !pr.labels.exists(l, l.name == "skip-review")'
  home-operations/charts-mirror:
    ignore: ["charts/**"]
  onedr0p/*:
    models:
      review: local/claude-opus-5
    forks: true
    settle: 2m

accounts:
  home-operations:
    limits:
      reviewsPerDay: 200
